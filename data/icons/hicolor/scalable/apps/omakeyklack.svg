<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- App-Symbol fuer Fenster und Anwendungsmenue - dasselbe Motiv wie im
       Tray, aber auf eigenem Grund. Anders als das Tray-Symbol kann dieses
       hier nicht zwischen hell und dunkel wechseln: Die .desktop-Datei nennt
       genau einen Namen, und das Anwendungsmenue faerbt nichts um. Der dunkle
       Grund macht es davon unabhaengig, welche Farbe dahinter liegt. -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#262a33"/>
  <!-- Tastenkappe und Schallwellen, aus dem Tray-Symbol uebernommen -->
  <g transform="translate(8.7 10.9) scale(1.5) translate(-0.6 -3.2)"
     fill="none" stroke="#f5f5f5" stroke-width="1.8">
    <path d="M3.8 4.2h6a2.2 2.2 0 0 1 2.2 2.2v11.2a2.2 2.2 0 0 1-2.2 2.2h-6a2.2 2.2 0 0 1-2.2-2.2V6.4a2.2 2.2 0 0 1 2.2-2.2z"/>
    <path d="M14.6 7.8a6.63 6.63 0 0 1 0 8.4" stroke-linecap="round"/>
    <path d="M17.6 5.4a10.28 10.28 0 0 1 0 13.2" stroke-linecap="round"/>
  </g>
</svg>
